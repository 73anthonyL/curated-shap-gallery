</style></head><body><main><nav><a href="../index.html">Overview</a><a href="../dataset.html">Dataset beeswarms</a><a href="../method.html">How these plots were made</a></nav><h1>05_WORD-CHAR-TF-IDF_LIN-SVM</h1><p class="muted">13 of 34 curated texts match their expected label at the locked threshold (illustrative only).</p><figure><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/beeswarm.png" alt="Beeswarm for 05_WORD-CHAR-TF-IDF_LIN-SVM"></figure><h2>Expected extremist (17)</h2><div class="grid"><figure><figcaption><a href="../examples/curated_04.html">curated_04</a>: P = 0.690 <span class="ok">&#10003;</span><br><span class="muted">What’s happening in the country is white genocide we need to help our brothers and sisters</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_04.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_04.png" alt="Waterfall for curated_04" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_09.html">curated_09</a>: P = 0.553 <span class="bad">&#10007;</span><br><span class="muted">Just like we did a century ago in Germany I think we should give these people all the gas we can</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_09.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_09.png" alt="Waterfall for curated_09" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_20.html">curated_20</a>: P = 0.647 <span class="ok">&#10003;</span><br><span class="muted">I hate these border crossing monkey inhuman beasts deport them all #secureborders</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_20.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_20.png" alt="Waterfall for curated_20" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_21.html">curated_21</a>: P = 0.253 <span class="bad">&#10007;</span><br><span class="muted">How can you not think that every mongoloid needs to die is the real question</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_21.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_21.png" alt="Waterfall for curated_21" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_22.html">curated_22</a>: P = 0.368 <span class="bad">&#10007;</span><br><span class="muted">All these somali idiots are like diseased dogs they need to be put down immediately</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_22.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_22.png" alt="Waterfall for curated_22" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_23.html">curated_23</a>: P = 0.484 <span class="bad">&#10007;</span><br><span class="muted">I love lesbian women but the men in that group need to be treated like the animals they are</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_23.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_23.png" alt="Waterfall for curated_23" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_24.html">curated_24</a>: P = 0.321 <span class="bad">&#10007;</span><br><span class="muted">I used to have so many black friends but then they all started saying black lives matter so I had to stop ...</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_24.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_24.png" alt="Waterfall for curated_24" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_25.html">curated_25</a>: P = 0.492 <span class="bad">&#10007;</span><br><span class="muted">Hate crimes are never okay unl amples/curated_34.html">curated_34</a>: P = 0.650 <span class="ok">&#10003;</span><br><span class="muted">Why are we supporting asian immigration they’re the enemies</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_34.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_34.png" alt="Waterfall for curated_34" loading="lazy"></a></figure></div><h2>Expected non-extremist (17)</h2><div class="grid"><figure><figcaption><a href="../examples/curated_01.html">curated_01</a>: P = 0.450 <span class="ok">&#10003;</span><br><span class="muted">I just love how we blame all terrorism on Muslims we can’t go to the airports without dealing with racism ...</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_01.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_01.png" alt="Waterfall for curated_01" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_02.html">curated_02</a>: P = 0.595 <span class="bad">&#10007;</span><br><span class="muted">Some people are saying that all jews need to die like how do they think this</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_02.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_02.png" alt="Waterfall for curated_02" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_03.html">curated_03</a>: P = 0.709 <span class="bad">&#10007;</span><br><span class="muted">I don’t believe that we should kill all women thank you very much</span></figcaption><a href="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_03.png"><img class="plot" src="../by_model/05_WORD-CHAR-TF-IDF_LIN-SVM/waterfall_curated_03.png" alt="Waterfall for curated_03" loading="lazy"></a></figure><figure><figcaption><a href="../examples/curated_05.html">curated_05</a>: P = 0.693 <span class="bad">&#10007;</span><br><span clas
